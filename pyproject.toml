[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-invariant-manifold-lbm"
version = "0.1.0"
description = "Tensor-train parameterized invariant-manifold research for lattice Boltzmann maps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gmpy2==2.3.1",
  "numpy>=2.0",
  "scipy>=1.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
